name: Pubblica Legnometria

# La pubblicazione parte sempre da main, non dai tag, per rispettare
# le regole di protezione dell'ambiente github-pages.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release da pubblicare (es. v0.18.0)'
        required: true
        default: 'v0.18.0'
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: legnometria-pages
  cancel-in-progress: false

jobs:
  build:
    name: Compila e verifica Legnometria
    runs-on: ubuntu-latest
    steps:
      - name: Recupera il repository
        uses: actions/checkout@v4

      - name: Installa Node.js solo sul server GitHub
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Scarica lo ZIP della release scelta
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p site
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'Legnometria_web_*.zip' --dir "$RUNNER_TEMP"
          shopt -s nullglob
          packages=("$RUNNER_TEMP"/Legnometria_web_*.zip)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo 'Errore: atteso esattamente uno ZIP Legnometria_web_*.zip nella release.'
            exit 1
          fi
          unzip -q "${packages[0]}" -d site
          test -f site/package.json
          test -f site/index.html
          test -f site/tools/prepare-offline.mjs
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('site/package.json')); if ('v'+p.version!==process.env.RELEASE_TAG) { console.error('Tag e versione package.json non corrispondono'); process.exit(1) }"

      - name: Installa Three.js ufficiale
        working-directory: site
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Test automatici
        working-directory: site
        run: npm test

      - name: Prepara risorse 3D e cache offline
        working-directory: site
        run: npm run prepare:offline

      - name: Verifica dipendenze offline
        working-directory: site
        run: npm run check:offline

      - name: Verifica esportazione HTML 3D autonoma
        working-directory: site
        run: node tools/check-standalone.mjs

      - name: Crea sito statico
        working-directory: site
        run: npm run build:static

      - name: Verifica pacchetto distribuibile
        working-directory: site
        run: npm run verify:release

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica l'artefatto Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Pubblica il sito
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Attendi che GitHub renda disponibile l'artefatto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..15}; do
            artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | head -n 1)
            if [ -n "$artifact_id" ]; then
              echo "Artefatto GitHub Pages disponibile: $artifact_id"
              exit 0
            fi
            echo "Artefatto non ancora visibile (tentativo $attempt/15)"
            sleep 4
          done
          echo 'Errore: il pacchetto Pages non compare nelle API GitHub.'
          exit 1

      - name: Pubblica Legnometria
        id: deployment
        uses: actions/deploy-pages@v4
