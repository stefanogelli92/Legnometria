name: Pubblica Legnometria

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: legnometria-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Recupera le impostazioni di GitHub Actions
        uses: actions/checkout@v4

      - name: Installa Node.js sul server GitHub, non sul PC
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Scarica il pacchetto web dalla release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          gh release download v0.17.2 --repo "$GITHUB_REPOSITORY" --pattern "Legnometria_web_v0_17_2.zip" --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/Legnometria_web_v0_17_2.zip" -d site
          test -f site/package.json
          test -f site/index.html
          test -f site/tools/prepare-offline.mjs

      - name: Scarica Three.js 0.180.0 sul server GitHub
        working-directory: site
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Test automatici
        working-directory: site
        run: npm test

      - name: Prepara risorse 3D e cache offline
        working-directory: site
        run: npm run prepare:offline

      - name: Verifica funzionamento offline
        working-directory: site
        run: npm run check:offline

      - name: Verifica export HTML 3D indipendente
        working-directory: site
        run: node tools/check-standalone.mjs

      - name: Crea sito statico
        working-directory: site
        run: npm run build:static

      - name: Verifica sito distribuibile
        working-directory: site
        run: npm run verify:release

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica sito statico
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Pubblica sito
        id: deploy
        uses: actions/deploy-pages@v4
